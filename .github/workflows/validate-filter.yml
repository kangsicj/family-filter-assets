name: Validate filter

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check generated filter
        run: python scripts/build_filter.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lint AdGuard rules
        run: >-
          npx --yes @adguard/aglint@3.0.2
          docs/filters/2026/7f3a91c2-family.txt
          filter-src/rules.txt
