<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Family Filter — A calm, ad-free web for the whole family">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B6E4F"/>
      <stop offset="1" stop-color="#2BC48A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#C7F9CC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C7F9CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.10"/></pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Roboto, sans-serif">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <rect width="1280" height="360" fill="url(#glow2)"/>
    <circle cx="1130" cy="300" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="1130" cy="300" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <g transform="translate(64,70)">
      <rect width="120" height="120" rx="32" fill="#FFFFFF" fill-opacity="0.16" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="60" y="84" text-anchor="middle" font-size="64">🛡️</text>
    </g>
    <text x="212" y="128" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Family Filter</text>
    <text x="214" y="176" font-size="28" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">A calm, ad-free web for the whole family</text>
    <text x="66" y="240" font-size="21" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">가족 공유 AdGuard 사용자 필터 · 허용 목록 · 한국 사이트 정리</text>
    <g transform="translate(64,270)"><rect width="106" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/><text x="53" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">AdGuard</text></g>
    <g transform="translate(182,270)"><rect width="130" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/><text x="65" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Allowlist</text></g>
    <g transform="translate(324,270)"><rect width="164" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/><text x="82" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Korean sites</text></g>
    <g transform="translate(500,270)"><rect width="164" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/><text x="82" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">CI-validated</text></g>
    <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
